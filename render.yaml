# render.yaml — Render Infrastructure as Code
# =============================================
# This file defines all 4 services for the HealthCare_with_Ai platform.
# Commit this file to your repo root; Render will auto-detect it.
#
# Deploy steps:
#   1. Push this file to GitHub
#   2. In Render dashboard → "New" → "Blueprint" → connect your repo
#   3. Render will create all 4 services automatically
#
# Free Tier RAM budget per service (512 MB limit):
#   healthcare-backend  : ~300 MB  ✅
#   healthcare-ai       : ~420 MB  ✅
#   healthcare-lungai   : ~360 MB  ✅
#   healthcare-frontend : 0 MB (Static Site, CDN) ✅

services:
  # ──────────────────────────────────────────
  # 1. Spring Boot Backend
  # ──────────────────────────────────────────
  - name: healthcare-backend
    type: web
    runtime: docker
    dockerfilePath: ./BackEnd/Dockerfile
    dockerContext: ./BackEnd
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/./urandom"
      # Database Configuration
      - key: DATABASE_URL
        value: "jdbc:postgresql://ep-wandering-wildflower-a1exphgy-pooler.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require"
      - key: DATABASE_USERNAME
        value: "neondb_owner"
      - key: DATABASE_PASSWORD
        sync: false  # Mark as secret - you'll set this in Render dashboard
      # Gemini API Configuration
      - key: GEMINI_API_KEY
        sync: false  # Mark as secret
      - key: GEMINI_API_URL
        value: "https://generativelanguage.googleapis.com/v1"
      - key: GEMINI_API_MODEL
        value: "gemini-2.5-flash-lite"
      # Email Configuration
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USERNAME
        sync: false  # Mark as secret
      - key: MAIL_PASSWORD
        sync: false  # Mark as secret
      - key: RESEND_API_KEY
        sync: false  # Mark as secret
      # Admin Credentials
      - key: ADMIN_EMAIL
        sync: false  # Mark as secret
      - key: ADMIN_PASSWORD
        sync: false  # Mark as secret

  # ──────────────────────────────────────────
  # 2. FastAPI Medical AI Server
  # ──────────────────────────────────────────
  - name: healthcare-ai
    type: web
    runtime: docker
    dockerfilePath: ./AI/fastapi_server/Dockerfile
    dockerContext: ./AI/fastapi_server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

  # ──────────────────────────────────────────
  # 3. LungAI Gradio Interface
  # ──────────────────────────────────────────
  - name: healthcare-lungai
    type: web
    runtime: docker
    dockerfilePath: ./AI/LungAI/Dockerfile
    dockerContext: ./AI/LungAI
    plan: free
    healthCheckPath: /
    envVars:
      - key: GRADIO_SERVER_NAME
        value: "0.0.0.0"
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"

  # ──────────────────────────────────────────
  # 4. React Frontend (Static Site)
  #    FREE tier, CDN-served, never spins down
  # ──────────────────────────────────────────
  - name: healthcare-frontend
    type: web
    runtime: static
    buildCommand: cd FrontEnd && npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./FrontEnd/dist
    plan: free
    envVars:
      # ── CRITICAL: Vite bakes these into the JS bundle at BUILD TIME ──
      # These must match your actual Render service URLs.
      # Update VITE_API_BASE_URL to your Spring Boot service URL (healthcare-backend)
      # Update VITE_AI_API_BASE_URL to your FastAPI service URL (healthcare-ai)
      - key: VITE_API_BASE_URL
        value: https://healthcare-backend.onrender.com/api
      - key: VITE_AI_API_BASE_URL
        value: https://healthcare-ai.onrender.com
    routes:
      # All routes fall back to index.html for React Router (SPA)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Security headers
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
