# render.yaml — Render Infrastructure as Code
# =============================================
# This file defines the services for the HealthCare_with_Ai platform.
# The frontend is served by the Spring Boot backend (single service).
#
# Deploy steps:
#   1. Push this file to GitHub
#   2. In Render dashboard → "New" → "Blueprint" → connect your repo
#   3. Render will create all services automatically
#
# Free Tier RAM budget per service (512 MB limit):
#   healthcare-with-ai  : ~350 MB (Backend + Frontend) ✅
#   healthcare-ai       : ~420 MB  ✅

services:
  # ──────────────────────────────────────────
  # 1. Spring Boot Backend + React Frontend (Integrated)
  # ──────────────────────────────────────────
  - name: healthcare-with-ai
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile.integrated
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/./urandom"
      # Database Configuration
      - key: DATABASE_URL
        value: "jdbc:postgresql://ep-wandering-wildflower-a1exphgy-pooler.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require"
      - key: DATABASE_USERNAME
        value: "neondb_owner"
      - key: DATABASE_PASSWORD
        sync: false  # Mark as secret - you'll set this in Render dashboard
      # Gemini API Configuration
      - key: GEMINI_API_KEY
        sync: false  # Mark as secret
      - key: GEMINI_API_URL
        value: "https://generativelanguage.googleapis.com/v1"
      - key: GEMINI_API_MODEL
        value: "gemini-2.5-flash-lite"
      # Email Configuration
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USERNAME
        sync: false  # Mark as secret
      - key: MAIL_PASSWORD
        sync: false  # Mark as secret
      - key: RESEND_API_KEY
        sync: false  # Mark as secret
      # Admin Credentials
      - key: ADMIN_EMAIL
        sync: false  # Mark as secret
      - key: ADMIN_PASSWORD
        sync: false  # Mark as secret
      # Frontend API URLs (build-time pins). Leave unset to enable runtime
      # host detection (see FrontEnd/src/services/api.js).
      # - key: VITE_API_BASE_URL
      #   value: "/api"
      # - key: VITE_AI_API_BASE_URL
      #   value: "https://healthcare-ai.onrender.com"

  # ──────────────────────────────────────────
  # 2. FastAPI Medical AI Server
  # ──────────────────────────────────────────
  - name: healthcare-ai
    type: web
    runtime: docker
    dockerfilePath: ./AI/fastapi_server/Dockerfile
    dockerContext: ./AI/fastapi_server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

