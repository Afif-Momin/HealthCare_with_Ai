# ===============================
# Server Configuration
# ===============================
# Render provides PORT env var - use it, fallback to 8080 for local dev
server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=medical-ai-backend

# ===============================
# Render Free Tier Memory Optimisations
# ===============================
# Delay bean creation until first use — reduces startup RAM spike
spring.main.lazy-initialization=true
# Smaller thread pool for embedded Tomcat (default=200, free tier needs ≤10)
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
# Disable unnecessary actuator overhead
spring.jmx.enabled=false


# ===============================
# Database Configuration (PostgreSQL - Neon)
# ===============================
# Use environment variables for security - fallback to local dev values
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-wandering-wildflower-a1exphgy-pooler.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_y4I3oGnubTSJ}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP pool — 3 connections max (default=10; each Neon connection costs RAM)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000


# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Disable SQL logging in production (saves I/O + RAM)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


# ===============================
# Logging
# ===============================
logging.level.com.medicalai=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN


